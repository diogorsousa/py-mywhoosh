[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-mywhoosh"
dynamic = ["version"]
description = "A lightweight, modular, and dependency-free Python client for the MyWhoosh API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Diogo Sousa" }
]
keywords = ["mywhoosh", "cycling", "workouts", "fitness", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
mywhoosh = "mywhoosh.cli:main"

[project.urls]
Homepage = "https://github.com/diogorsousa/py-mywhoosh"
Documentation = "https://github.com/diogorsousa/py-mywhoosh#readme"
Repository = "https://github.com/diogorsousa/py-mywhoosh"
Issues = "https://github.com/diogorsousa/py-mywhoosh/issues"

[tool.hatch.version]
path = "mywhoosh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mywhoosh"]

[tool.hatch.build.targets.sdist]
include = [
    "/mywhoosh",
    "/tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
